<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Mapa Interactivo</title>
<!-- Aquí irá el CSS -->
<style>
body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4;}
/* Contenedor del mapa */
.mapa-contenedor {
max-width: 800px;
margin: 0 auto;
background-color: white; /* Aquí podrías poner tu imagen de fondo original
usando CSS */
box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
/* PASO 6: Magia CSS para los lotes */
/* Todos los elementos dentro del SVG que tengan ID que empiece con "lote" */
[id^="lote"] {
cursor: pointer; /* Cambia el cursor a una manita */
transition: 0.3s ease; /* Animación suave */
fill: rgba(0, 0, 0, 0.3); /* Color por defecto: gris transparente */
}
/* Cuando el mouse pasa por encima del lote */
[id^="lote"]:hover {
fill: rgba(46, 204, 113, 0.7); /* Se pinta de verde */
stroke: #27ae60; /* Borde verde fuerte */
stroke-width: 3px;
}
/* Diseño de la ventana modal (oculta por defecto) */
.modal {
display: none; /* Oculto inicialmente */
position: fixed; top: 50%; left: 50%;
transform: translate(-50%, -50%);
background: white; padding: 30px; border-radius: 10px;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
z-index: 1000;
}
.modal-overlay {
display: none;
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.5); z-index: 999;
}
button { padding: 10px 20px; background: #e74c3c; color: white; border: none;
cursor: pointer; border-radius: 5px; }
</style>
</head>

<!-- Nuestra ventana Modal -->
<div class="modal-overlay" id="fondo-modal"></div>
<div class="modal" id="mi-modal">
<h2 id="titulo-lote">Nombre del Lote</h2>
<p>Estado: <strong>Disponible</strong></p>
<p>Área: 250 m²</p>
<button id="btn-cerrar">Cerrar</button>
</div>
<!-- PASO 7: Lógica de JavaScript -->
<script>
// 1. Identificamos los elementos
// Selecciona todos los elementos cuyo ID empiece con "lote"
const lotes = document.querySelectorAll('[id^="lote"]');
const modal = document.getElementById('mi-modal');
const overlay = document.getElementById('fondo-modal');
const titulo = document.getElementById('titulo-lote');
const btnCerrar = document.getElementById('btn-cerrar');
// 2. Le decimos a cada lote qué hacer al darle clic
lotes.forEach(lote => {
lote.addEventListener('click', function() {
// Sacamos el ID del lote clickeado (ej. "lote-1")
const nombreLote = this.getAttribute('id');
// Formateamos el texto (cambiamos "lote-1" a "Lote 1")
titulo.innerText = nombreLote.replace('-', ' ').toUpperCase();
// Mostramos el modal
modal.style.display = 'block';
overlay.style.display = 'block';
});
});
// 3. Función para cerrar el modal
function cerrarModal() {
modal.style.display = 'none';
overlay.style.display = 'none';
}
btnCerrar.addEventListener('click', cerrarModal);
overlay.addEventListener('click', cerrarModal); // Cierra al hacer clic afuera
</script>
